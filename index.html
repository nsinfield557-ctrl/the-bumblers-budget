const ITERATIONS = 600000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryDecrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
    key,
    b64ToBytes(CT_B64)
  );
  return new TextDecoder().decode(decrypted);
}

async function attempt() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const html = await tryDecrypt(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.style.display = 'block';
  }
}

document.getElementById('submit').addEventListener('click', attempt);
document.getElementById('pw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') attempt();
});
</script>
