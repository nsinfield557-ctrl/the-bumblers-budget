<title>Wealth Plan Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: #F7F6F2; color: #1A1A18;
  }
  .gate {
    background: #FFFFFF; border: 1px solid #E1E0D9; border-radius: 12px;
    padding: 2rem; width: 100%; max-width: 340px; text-align: center;
  }
  .gate h1 { font-size: 18px; font-weight: 600; margin: 0 0 1.25rem; }
  .gate input {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #E1E0D9;
    border-radius: 8px; margin-bottom: 12px; outline: none;
  }
  .gate input:focus { border-color: #2a78d6; }
  .gate button {
    width: 100%; padding: 10px 12px; font-size: 15px; font-weight: 600; color: white;
    background: #2a78d6; border: none; border-radius: 8px; cursor: pointer;
  }
  .gate button:hover { background: #1f5fac; }
  .gate p.error { color: #c0392b; font-size: 13px; margin: 10px 0 0; display: none; }
</style>
</head>

  <input type="password" id="pw" placeholder="Password" autofocus />

</div>

const ITERATIONS = 600000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryDecrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
    key,
    b64ToBytes(CT_B64)
  );
  return new TextDecoder().decode(decrypted);
}

async function attempt() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const html = await tryDecrypt(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.style.display = 'block';
  }
}

document.getElementById('submit').addEventListener('click', attempt);
document.getElementById('pw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') attempt();
});
</script>
